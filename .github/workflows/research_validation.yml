name: Research Validation (Live YouTube API)

# Triggered ONLY manually — never on push or schedule.
on:
  workflow_dispatch:

jobs:
  research_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ─────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Dependencies ───────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      # ── 4. Write OAuth credentials for potential future upload steps ───────
      # Research itself does NOT use OAuth — it uses YOUTUBE_API_KEY.
      # token.json / client_secret.json are written here only for completeness
      # and to keep the cleanup step consistent with the upload workflow.
      - name: Write OAuth credentials from GitHub Secrets
        run: |
          echo '${{ secrets.TOKEN_JSON }}' > token.json
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json
          echo "✅ OAuth credentials written to workspace (not printed)."

      # ── 5. Run live research engine (API key mode) ─────────────────────────
      - name: Run Research Engine (Live YouTube API key, limit=3)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python run_research.py --limit 3

      # ── 6. Validate data_source is youtube_api (not mock or offline) ───────
      - name: Validate data_source is youtube_api (not mock or offline)
        run: |
          RESULTS_FILE=$(find data/research -name "research_results_*.json" | sort | tail -n 1)

          if [ -z "$RESULTS_FILE" ]; then
            echo "❌ ERROR: No research results JSON file found in data/research/"
            exit 1
          fi

          echo "📄 Found results file: $RESULTS_FILE"

          REAL_COUNT=$(python3 -c "
          import json, sys
          data = json.loads(open('$RESULTS_FILE', encoding='utf-8').read())
          real = [c for c in data if c.get('data_source') in ('youtube_api', 'cached_youtube_api')]
          mock = [c for c in data if c.get('data_source') in ('mock', 'offline')]
          print(f'Real API results:     {len(real)}')
          print(f'Mock/offline results: {len(mock)}')
          if mock:
              print('MOCK_DETECTED')
          else:
              print('ALL_REAL')
          ")

          echo "$REAL_COUNT"

          if echo "$REAL_COUNT" | grep -q "MOCK_DETECTED"; then
            echo "❌ VALIDATION FAILED: Research results contain mock or offline data."
            echo "   Possible causes:"
            echo "   1. YOUTUBE_API_KEY secret is missing or invalid."
            echo "   2. YouTube API quota was exhausted for today."
            echo "   3. API key restrictions block this runner's IP."
            exit 1
          fi

          echo "✅ VALIDATION PASSED: All research results sourced from real YouTube API."

      # ── 7. Run Topic Decision Engine ───────────────────────────────────────
      - name: Run Topic Decision Engine (min-score=60)
        run: |
          RESULTS_FILE=$(find data/research -name "research_results_*.json" | sort | tail -n 1)
          if [ -z "$RESULTS_FILE" ]; then
            echo "❌ ERROR: No research results JSON file found."
            exit 1
          fi
          echo "📄 Running decision engine on: $RESULTS_FILE"
          python run_decision.py --input "$RESULTS_FILE" --min-score 60

      # ── 8. Validate Topic Decision Output (production gates) ────────────────
      - name: Validate Topic Decision Output (safety check)
        run: |
          DECISION_FILE=$(find data/decision -name "decision_*.json" | sort | tail -n 1)
          if [ -z "$DECISION_FILE" ]; then
            echo "❌ ERROR: No decision JSON file found in data/decision/"
            exit 1
          fi
          echo "📄 Found decision file: $DECISION_FILE"
          cat "$DECISION_FILE"

          python3 -c "
          import json, sys
          data = json.loads(open('$DECISION_FILE', encoding='utf-8').read())
          approved = data.get('approved_for_generation')
          topic = data.get('selected_topic')
          source = data.get('data_source')
          confidence = data.get('confidence')
          score = data.get('score')

          print('REAL RESEARCH: PASS')
          print(f'DECISION: {\"APPROVED\" if approved else \"REJECTED\"}')
          print(f'SELECTED TOPIC: {topic}')
          print(f'SCORE: {score}')
          print(f'CONFIDENCE: {confidence}')
          print(f'DATA SOURCE: {source}')

          if approved is not True:
              print('❌ VALIDATION FAILED: approved_for_generation is not true')
              sys.exit(1)
          if not topic:
              print('❌ VALIDATION FAILED: selected_topic is missing/empty')
              sys.exit(1)
          if source not in ('youtube_api', 'cached_youtube_api'):
              print(f'❌ VALIDATION FAILED: data_source {source} is not production-safe')
              sys.exit(1)
          if confidence != 'high':
              print(f'❌ VALIDATION FAILED: confidence {confidence} is not high')
              sys.exit(1)
          print('✅ VALIDATION PASSED: Topic decision is production-safe!')
          "

      # ── 9. Upload validation artifacts (both research and decision) ────────
      - name: Upload validation results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            data/research/research_results_*.json
            data/decision/decision_*.json
          if-no-files-found: warn
          retention-days: 7

      # ── 10. Mandatory credential cleanup ──────────────────────────────────
      # if: always() guarantees deletion even on failure or cancellation.
      - name: Cleanup credentials (mandatory)
        if: always()
        run: |
          rm -f token.json client_secret.json
          echo "🧹 OAuth credentials deleted from runner workspace."
          if [ -f token.json ] || [ -f client_secret.json ]; then
            echo "❌ WARNING: Credential files still exist after cleanup!"
            exit 1
          fi
          echo "✅ Credential cleanup verified."
