name: Research Validation (Live YouTube API)

# Triggered ONLY manually — never on push or schedule.
on:
  workflow_dispatch:

jobs:
  research_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ─────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Dependencies ───────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      # ── 4. Write credentials (ephemeral — never printed) ──────────────────
      - name: Write credentials from GitHub Secrets
        run: |
          echo '${{ secrets.TOKEN_JSON }}' > token.json
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json
          echo "✅ Credentials written to workspace (not printed)."

      # ── 5. Run live research engine ───────────────────────────────────────
      - name: Run Research Engine (Live YouTube API, limit=3)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python run_research.py --limit 3

      # ── 6. Validate that results use real API data (not mock/offline) ─────
      - name: Validate data_source is youtube_api (not mock or offline)
        run: |
          RESULTS_FILE=$(find data/research -name "research_results_*.json" | sort | tail -n 1)

          if [ -z "$RESULTS_FILE" ]; then
            echo "❌ ERROR: No research results JSON file found in data/research/"
            exit 1
          fi

          echo "📄 Found results file: $RESULTS_FILE"

          # Count candidates using real API (youtube_api or cached_youtube_api)
          REAL_COUNT=$(python3 -c "
          import json, sys
          data = json.loads(open('$RESULTS_FILE', encoding='utf-8').read())
          real = [c for c in data if c.get('data_source') in ('youtube_api', 'cached_youtube_api')]
          mock = [c for c in data if c.get('data_source') in ('mock', 'offline')]
          print(f'Real API results:  {len(real)}')
          print(f'Mock/offline results: {len(mock)}')
          if mock:
              print('MOCK_DETECTED')
          else:
              print('ALL_REAL')
          ")

          echo "$REAL_COUNT"

          if echo "$REAL_COUNT" | grep -q "MOCK_DETECTED"; then
            echo "❌ VALIDATION FAILED: Research results contain mock or offline data."
            echo "   This means credentials were invalid or quota was exhausted."
            exit 1
          fi

          echo "✅ VALIDATION PASSED: All research results sourced from real YouTube API."

      # ── 7. Upload research results as GitHub Actions artifact ─────────────
      - name: Upload research results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: data/research/research_results_*.json
          if-no-files-found: warn
          retention-days: 7

      # ── 8. Mandatory credential cleanup ───────────────────────────────────
      # Uses if: always() to guarantee deletion even on failure or cancellation.
      - name: Cleanup credentials (mandatory)
        if: always()
        run: |
          rm -f token.json client_secret.json
          echo "🧹 Credentials deleted from runner workspace."
          # Confirm deletion
          if [ -f token.json ] || [ -f client_secret.json ]; then
            echo "❌ WARNING: Credential files still exist after cleanup!"
            exit 1
          fi
          echo "✅ Credential cleanup verified."
