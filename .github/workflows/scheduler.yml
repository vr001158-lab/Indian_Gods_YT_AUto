name: God Channel Automation

env:
  RENDER_ONLY: "true"
  YOUTUBE_PUBLISH: "false"
  YOUTUBE_PUBLISH_AUTHORIZED: "false"
  ENABLE_GOOGLE_DRIVE: "false"

# Scheduled triggers disabled in favor of divine-dharshanam-daily.yml to eliminate duplicate-upload hazards.
# Use workflow_dispatch below for manual execution if required.
# on:
#   schedule:
#     - cron: '30 01 * * *'
#     - cron: '30 13 * * *'
#     - cron: '30 06 * * *'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Video mode to generate'
        required: true
        default: 'multi_image'
        type: choice
        options:
          - multi_image
          - single_image
          - long_video

jobs:
  upload_short_a:
    name: Short A — Multi Image (7 AM IST)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'multi_image' || github.event_name == 'schedule' && startsWith(github.event.schedule, '30 01')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libass-dev

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Cache conformed assets
        uses: actions/cache@v4
        with:
          path: |
            assets/gods_processed/
            assets/asset_manifest.json
          key: ${{ runner.os }}-conformed-assets-v2.1-${{ hashFiles('assets/gods/**') }}
          restore-keys: |
            ${{ runner.os }}-conformed-assets-v2.1-

      - name: Prepare assets
        run: python prepare_assets.py

      - name: Generate Short A (multi_image, dry-run validation)
        env:
          PYTHONUNBUFFERED: "1"
          RENDER_ONLY: "true"
          YOUTUBE_PUBLISH: "false"
          YOUTUBE_PUBLISH_AUTHORIZED: "false"
          ENABLE_GOOGLE_DRIVE: "false"
        run: |
          python uploader.py --mode multi_image --dry-run

  upload_short_b:
    name: Short B — Single Image (7 PM IST)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'single_image' || github.event_name == 'schedule' && startsWith(github.event.schedule, '30 13')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libass-dev

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Cache conformed assets
        uses: actions/cache@v4
        with:
          path: |
            assets/gods_processed/
            assets/asset_manifest.json
          key: ${{ runner.os }}-conformed-assets-v2.1-${{ hashFiles('assets/gods/**') }}
          restore-keys: |
            ${{ runner.os }}-conformed-assets-v2.1-

      - name: Prepare assets
        run: python prepare_assets.py

      - name: Generate Short B (single_image, dry-run validation)
        env:
          PYTHONUNBUFFERED: "1"
          RENDER_ONLY: "true"
          YOUTUBE_PUBLISH: "false"
          YOUTUBE_PUBLISH_AUTHORIZED: "false"
          ENABLE_GOOGLE_DRIVE: "false"
        run: |
          python uploader.py --mode single_image --dry-run

  upload_long_video:
    name: Long Video — Landscape (12 PM IST)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'long_video' || github.event_name == 'schedule' && startsWith(github.event.schedule, '30 06')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libass-dev

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Cache conformed assets
        uses: actions/cache@v4
        with:
          path: |
            assets/gods_processed/
            assets/asset_manifest.json
          key: ${{ runner.os }}-conformed-assets-v2.1-${{ hashFiles('assets/gods/**') }}
          restore-keys: |
            ${{ runner.os }}-conformed-assets-v2.1-

      - name: Prepare assets
        run: python prepare_assets.py

      - name: Generate Long Video (dry-run validation)
        env:
          PYTHONUNBUFFERED: "1"
          RENDER_ONLY: "true"
          YOUTUBE_PUBLISH: "false"
          YOUTUBE_PUBLISH_AUTHORIZED: "false"
          ENABLE_GOOGLE_DRIVE: "false"
        run: |
          python uploader.py --mode long_video --dry-run
