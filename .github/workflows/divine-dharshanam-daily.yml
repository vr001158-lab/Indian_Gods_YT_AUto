name: Divine Dharshanam Daily — Production Automated Pipeline

on:
  schedule:
    # 1. Slot 1 Daily Telugu Short: 06:30 AM IST = 01:00 UTC - Every day
    - cron: '0 1 * * *'
    # 2. Long Video Telugu Landscape: 11:30 AM IST = 06:00 UTC - Every 3 days (rolling 72h)
    - cron: '0 6 */3 * *'
    # 3. Slot 2 Daily Telugu Short: 06:30 PM IST = 13:00 UTC - Every day
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      content_type:
        description: 'Content Format (short: 1080x1920 9:16 | long: 1920x1080 16:9)'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long
      format:
        description: 'Production Format (narrated: narrated with captions)'
        required: true
        default: 'narrated'
        type: choice
        options:
          - narrated
      language_code:
        description: 'Target Language (Telugu only: te-IN)'
        required: true
        default: 'te-IN'
        type: choice
        options:
          - te-IN
      dry_run:
        description: 'Dry Run Mode (validates pipeline, stops before YouTube upload without consuming quota)'
        required: true
        default: true
        type: boolean
      execution_mode:
        description: 'Execution Mode (dry_run: offline mock validation | render_only: real media render without publishing)'
        required: false
        default: 'dry_run'
        type: choice
        options:
          - dry_run
          - render_only
      privacy_status:
        description: 'YouTube Privacy Status (unlisted / private for test runs | public for production)'
        required: true
        default: 'unlisted'
        type: choice
        options:
          - unlisted
          - private
          - public

concurrency:
  group: divine-dharshanam-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  production-pipeline:
    name: Execute Automated Production Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install system dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak libespeak-dev fonts-indic fonts-noto-core fonts-deva fonts-telu fonts-taml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Reconstruct OAuth Credentials & Tokens (Securely)
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          if [ -n "$TOKEN_JSON" ]; then
            echo "$TOKEN_JSON" > token.json
            chmod 600 token.json
            echo "✅ token.json reconstructed from GitHub Secret."
          else
            echo "⚠️ TOKEN_JSON secret is empty or missing."
          fi

          if [ -n "$CREDENTIALS_JSON" ]; then
            echo "$CREDENTIALS_JSON" > credentials.json
            chmod 600 credentials.json
            echo "✅ credentials.json reconstructed from GitHub Secret."
          else
            echo "⚠️ CREDENTIALS_JSON secret is empty or missing."
          fi

      - name: Bootstrap CI Minimal Test Assets
        run: |
          python ci_bootstrap.py

      - name: Run Complete Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Verify Asset Plan SHA256 Integrity
        run: |
          python -c "
          import hashlib, pathlib
          p = pathlib.Path('data/visuals/asset_plan_20260814_071510.json')
          expected = 'f6ca03a2dfec5add5b9bce5ce699124bfdffacf42f009b2a9d4b1c02a5f87b33'
          raw = p.read_bytes()
          # Normalize to canonical CRLF form (matches committed Windows-origin fixture)
          canonical = raw.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
          actual = hashlib.sha256(canonical).hexdigest()
          assert actual == expected, f'Asset plan SHA256 mismatch! Expected {expected}, got {actual}'
          print('✅ Asset plan SHA256 integrity verified!')
          "

      - name: Execute Canonical Production Pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          LANGUAGE_CODE_INPUT: ${{ inputs.language_code }}
          CONTENT_TYPE_INPUT: ${{ inputs.content_type }}
          FORMAT_INPUT: ${{ inputs.format }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          EXECUTION_MODE_INPUT: ${{ inputs.execution_mode }}
          PRIVACY_STATUS_INPUT: ${{ inputs.privacy_status }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          EXEC_MODE="${EXECUTION_MODE_INPUT:-dry_run}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$EXEC_MODE" = "render_only" ]; then
            echo "🎬 [RENDER ONLY] Real media render mode selected. Enforcing strict publishing safety policy..."
            CT="short"
            FMT="narrated"
            LANG="te-IN"
            export YOUTUBE_PUBLISH_AUTHORIZED="false"
            export RENDER_ONLY="true"
            echo "🔒 YouTube publishing authorization forced to: $YOUTUBE_PUBLISH_AUTHORIZED"
            echo "🚀 Executing Telugu pipeline with content-type=$CT format=$FMT language=$LANG --render-only"
            python run_pipeline.py --language "$LANG" --content-type "$CT" --format "$FMT" --render-only
          else
            CT="${CONTENT_TYPE_INPUT:-short}"
            FMT="narrated"
            LANG="te-IN"
            EXP_TAG=""
            PRIVACY="public"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              PRIVACY="${PRIVACY_STATUS_INPUT:-unlisted}"
            fi
            export YOUTUBE_PRIVACY_STATUS="$PRIVACY"
            echo "🔒 YouTube Privacy Status: $YOUTUBE_PRIVACY_STATUS"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              case "$SCHEDULE_CRON" in
                "0 1 * * *")
                  CT="short"
                  FMT="narrated"
                  LANG="te-IN"
                  ;;
                "0 13 * * *")
                  CT="short"
                  FMT="narrated"
                  LANG="te-IN"
                  ;;
                "0 6 */3 * *")
                  CT="long"
                  FMT="narrated"
                  LANG="te-IN"
                  ;;
                *)
                  CT="short"
                  FMT="narrated"
                  LANG="te-IN"
                  ;;
              esac
            fi
            # Authorization policy:
            # 1. Scheduled production runs are authorized for live publication.
            # 2. Manual workflow_dispatch is authorized ONLY if dry_run is explicitly 'false'.
            # 3. All other events, missing inputs, empty inputs, or dry_run=true default to safe --dry-run.
            DRY="--dry-run"
            export YOUTUBE_PUBLISH_AUTHORIZED="false"

            if [ "${{ github.event_name }}" = "schedule" ]; then
              DRY=""
              export YOUTUBE_PUBLISH_AUTHORIZED="true"
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" = "false" ]; then
              DRY=""
              export YOUTUBE_PUBLISH_AUTHORIZED="true"
            fi
            echo "🚀 Executing Telugu pipeline with content-type=$CT format=$FMT language=$LANG $EXP_TAG $DRY"
            python run_pipeline.py --language "$LANG" --content-type "$CT" --format "$FMT" $EXP_TAG $DRY
          fi

      - name: Persist Lightweight Publishing History State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- data/visuals/asset_plan_20260814_071510.json || true
          git checkout -- assets/music/music_manifest.json || true
          git add data/publishing_history.json
          if git diff --cached --quiet; then
            echo "No publishing history changes to persist."
          else
            git commit -m "auto(publishing): update publishing_history.json [skip ci]"
            git push
          fi

      - name: Archive Render-Only Output Media
        if: always() && inputs.execution_mode == 'render_only'
        uses: actions/upload-artifact@v4
        with:
          name: divine-dharshanam-render-only-short
          path: data/render_only/
          if-no-files-found: ignore
