name: Divine Dharshanam Daily — Production Automated Pipeline

on:
  schedule:
    # 1. Slot 1 Daily Telugu Short: 06:30 AM IST = 01:00 UTC - Every day
    - cron: '0 1 * * *'
    # 2. Long Video Telugu Landscape: 11:30 AM IST = 06:00 UTC - Every 3 days (rolling 72h)
    - cron: '0 6 */3 * *'
    # 3. Slot 2 Daily Telugu Short: 06:30 PM IST = 13:00 UTC - Every day
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      content_type:
        description: 'Content Format (short: 1080x1920 9:16 | long: 1920x1080 16:9)'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long
      format:
        description: 'Production Format (narrated: narrated with captions)'
        required: true
        default: 'narrated'
        type: choice
        options:
          - narrated
      language_code:
        description: 'Target Language (Telugu only: te-IN)'
        required: true
        default: 'te-IN'
        type: choice
        options:
          - te-IN
      dry_run:
        description: 'Dry Run Mode (validates pipeline, stops before YouTube upload without consuming quota)'
        required: true
        default: true
        type: boolean
      execution_mode:
        description: 'Execution Mode (render_only: real media render without publishing | dry_run: offline mock validation)'
        required: false
        default: 'render_only'
        type: choice
        options:
          - render_only
          - dry_run
      privacy_status:
        description: 'YouTube Privacy Status (private by default)'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public

concurrency:
  group: divine-dharshanam-production
  cancel-in-progress: false

env:
  RENDER_ONLY: "true"
  YOUTUBE_PUBLISH: "false"
  YOUTUBE_PUBLISH_AUTHORIZED: "false"
  YOUTUBE_PRIVACY_STATUS: "private"

permissions:
  contents: read

jobs:
  production-pipeline:
    name: Execute Automated Production Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install system dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak libespeak-dev fonts-indic fonts-noto-core fonts-deva fonts-telu fonts-taml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Reconstruct OAuth Credentials & Tokens (Securely)
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          if [ -n "$TOKEN_JSON" ]; then
            echo "$TOKEN_JSON" > token.json
            chmod 600 token.json
            echo "✅ token.json reconstructed from GitHub Secret."
          else
            echo "⚠️ TOKEN_JSON secret is empty or missing."
          fi

          if [ -n "$CREDENTIALS_JSON" ]; then
            echo "$CREDENTIALS_JSON" > credentials.json
            chmod 600 credentials.json
            echo "✅ credentials.json reconstructed from GitHub Secret."
          else
            echo "⚠️ CREDENTIALS_JSON secret is empty or missing."
          fi

      - name: Bootstrap CI Minimal Test Assets
        run: |
          python ci_bootstrap.py

      - name: Run Complete Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Verify Asset Plan SHA256 Integrity
        run: |
          python -c "
          import hashlib, pathlib
          p = pathlib.Path('data/visuals/asset_plan_20260814_071510.json')
          expected = 'f6ca03a2dfec5add5b9bce5ce699124bfdffacf42f009b2a9d4b1c02a5f87b33'
          raw = p.read_bytes()
          # Normalize to canonical CRLF form (matches committed Windows-origin fixture)
          canonical = raw.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
          actual = hashlib.sha256(canonical).hexdigest()
          assert actual == expected, f'Asset plan SHA256 mismatch! Expected {expected}, got {actual}'
          print('✅ Asset plan SHA256 integrity verified!')
          "

      - name: Execute Canonical Production Pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          LANGUAGE_CODE_INPUT: ${{ inputs.language_code }}
          CONTENT_TYPE_INPUT: ${{ inputs.content_type }}
          FORMAT_INPUT: ${{ inputs.format }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          EXECUTION_MODE_INPUT: ${{ inputs.execution_mode }}
          PRIVACY_STATUS_INPUT: ${{ inputs.privacy_status }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          # Enforce baseline fail-closed publishing security state
          export RENDER_ONLY="true"
          export YOUTUBE_PUBLISH="false"
          export YOUTUBE_PUBLISH_AUTHORIZED="false"
          export YOUTUBE_PRIVACY_STATUS="private"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "⏰ [SCHEDULED RUN] Executing automated schedule strictly in RENDER-ONLY mode."
            echo "🔒 Scheduled runs CANNOT authorize or execute YouTube publishing."
            CT="short"
            case "$SCHEDULE_CRON" in
              "0 6 */3 * *") CT="long" ;;
              *) CT="short" ;;
            esac
            FMT="narrated"
            LANG="te-IN"
            echo "🚀 Executing Telugu pipeline with content-type=$CT format=$FMT language=$LANG --render-only"
            python run_pipeline.py --language "$LANG" --content-type "$CT" --format "$FMT" --render-only
          else
            # workflow_dispatch execution
            EXEC_MODE="${EXECUTION_MODE_INPUT:-render_only}"
            CT="${CONTENT_TYPE_INPUT:-short}"
            FMT="narrated"
            LANG="te-IN"

            if [ "$EXEC_MODE" = "render_only" ]; then
              echo "🎬 [RENDER ONLY] Real media render mode selected. Enforcing strict publishing safety policy..."
              export RENDER_ONLY="true"
              export YOUTUBE_PUBLISH="false"
              export YOUTUBE_PUBLISH_AUTHORIZED="false"
              echo "🚀 Executing Telugu pipeline with content-type=$CT format=$FMT language=$LANG --render-only"
              python run_pipeline.py --language "$LANG" --content-type "$CT" --format "$FMT" --render-only
            else
              # dry_run mode (mock/offline validation)
              echo "🔬 [DRY RUN] Offline mock validation mode selected. Live publishing disabled."
              export RENDER_ONLY="false"
              export YOUTUBE_PUBLISH="false"
              export YOUTUBE_PUBLISH_AUTHORIZED="false"
              echo "🚀 Executing Telugu pipeline with content-type=$CT format=$FMT language=$LANG --dry-run"
              python run_pipeline.py --language "$LANG" --content-type "$CT" --format "$FMT" --dry-run
            fi
          fi

      - name: Archive Publishing History State Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publishing-history-${{ github.run_id }}
          path: data/publishing_history.json
          if-no-files-found: ignore

      - name: Archive Render-Only Output Media
        if: always() && (github.event_name == 'schedule' || inputs.execution_mode == 'render_only')
        uses: actions/upload-artifact@v4
        with:
          name: divine-dharshanam-render-only-${{ github.run_id }}
          path: data/render_only/
          if-no-files-found: ignore
