name: Divine Dharshanam Daily — Production Automated Pipeline

on:
  schedule:
    # 1. Morning Daily Production (Hindi hi-IN): 06:00 AM IST = 00:30 UTC - Every day
    - cron: '30 0 * * *'
    # 2. Evening Daily Production (Telugu te-IN): 06:00 PM IST = 12:30 UTC - Every day
    - cron: '30 12 * * *'
    # 3. Weekly Long Video (Hindi hi-IN): 12:00 PM IST = 06:30 UTC - Tuesday only
    - cron: '30 6 * * 2'
    # 4. Weekly Long Video (Telugu te-IN): 12:00 PM IST = 06:30 UTC - Saturday only
    - cron: '30 6 * * 6'
  workflow_dispatch:
    inputs:
      content_type:
        description: 'Content Format (short: 1080x1920 9:16 | long: 1920x1080 16:9)'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long
      format:
        description: 'Production Format (old: devotional visual | narrated: narrated with captions)'
        required: true
        default: 'narrated'
        type: choice
        options:
          - narrated
          - old
      language_code:
        description: 'Target Language (hi-IN: Hindi | te-IN: Telugu)'
        required: true
        default: 'hi-IN'
        type: choice
        options:
          - hi-IN
          - te-IN
      dry_run:
        description: 'Dry Run Mode (stop before YouTube upload)'
        required: true
        default: true
        type: boolean

concurrency:
  group: divine-dharshanam-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  production-pipeline:
    name: Execute Automated Production Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak libespeak-dev fonts-indic fonts-noto-core fonts-deva fonts-telu fonts-taml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Reconstruct OAuth Credentials & Tokens (Securely)
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          if [ -n "$TOKEN_JSON" ]; then
            echo "$TOKEN_JSON" > token.json
            chmod 600 token.json
            echo "✅ token.json reconstructed from GitHub Secret."
          else
            echo "⚠️ TOKEN_JSON secret is empty or missing."
          fi

          if [ -n "$CREDENTIALS_JSON" ]; then
            echo "$CREDENTIALS_JSON" > credentials.json
            chmod 600 credentials.json
            echo "✅ credentials.json reconstructed from GitHub Secret."
          else
            echo "⚠️ CREDENTIALS_JSON secret is empty or missing."
          fi

      - name: Bootstrap CI Minimal Test Assets
        run: |
          python ci_bootstrap.py

      - name: Run Complete Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Verify Asset Plan SHA256 Integrity
        run: |
          python -c "
          import hashlib, pathlib
          p = pathlib.Path('data/visuals/asset_plan_20260814_071510.json')
          expected = 'f6ca03a2dfec5add5b9bce5ce699124bfdffacf42f009b2a9d4b1c02a5f87b33'
          raw = p.read_bytes()
          # Normalize to canonical CRLF form (matches committed Windows-origin fixture)
          canonical = raw.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
          actual = hashlib.sha256(canonical).hexdigest()
          assert actual == expected, f'Asset plan SHA256 mismatch! Expected {expected}, got {actual}'
          print('✅ Asset plan SHA256 integrity verified!')
          "

      - name: Execute Canonical Production Pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          LANGUAGE_CODE_INPUT: ${{ inputs.language_code }}
          CONTENT_TYPE_INPUT: ${{ inputs.content_type }}
          FORMAT_INPUT: ${{ inputs.format }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          CT="${CONTENT_TYPE_INPUT:-short}"
          FMT="${FORMAT_INPUT:-old}"
          LANG="${LANGUAGE_CODE_INPUT:-hi-IN}"
          EXP_TAG=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$SCHEDULE_CRON" in
              "30 0 * * *")
                CT="short"
                FMT="narrated"
                LANG="hi-IN"
                ;;
              "30 12 * * *")
                CT="short"
                FMT="narrated"
                LANG="te-IN"
                ;;
              "30 6 * * 2")
                CT="long"
                FMT="narrated"
                LANG="hi-IN"
                ;;
              "30 6 * * 6")
                CT="long"
                FMT="narrated"
                LANG="te-IN"
                ;;
              *)
                CT="short"
                FMT="narrated"
                LANG="hi-IN"
                ;;
            esac
          fi
          DRY=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            DRY="--dry-run"
          fi
          echo "🚀 Executing pipeline with content-type=$CT format=$FMT language=$LANG $EXP_TAG $DRY"
          python run_pipeline.py --language "$LANG" --content-type "$CT" --format "$FMT" $EXP_TAG $DRY

      - name: Persist Lightweight Publishing History State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- data/visuals/asset_plan_20260814_071510.json || true
          git checkout -- assets/music/music_manifest.json || true
          git add data/publishing_history.json
          git diff-index --quiet HEAD || git commit -m "auto(publishing): update publishing_history.json [skip ci]"
          git push || true
